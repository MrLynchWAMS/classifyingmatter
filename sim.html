<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Classifying Matter Detective</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#eef2ff;color:#1e293b}
.wrap{max-width:760px;margin:0 auto;padding:16px}
h1{margin:4px 0 12px;font-size:1.6rem;text-align:center;color:#3730a3}
nav{display:flex;gap:6px;margin-bottom:12px}
nav button{flex:1;padding:10px 4px;border:0;border-radius:12px;background:#fff;font-weight:700;font-size:.9rem;cursor:pointer;color:#475569;box-shadow:0 1px 3px #0001}
nav button.on{background:#4f46e5;color:#fff}
.card{background:#fff;border-radius:20px;box-shadow:0 8px 24px #4f46e522;padding:22px;animation:in .3s ease-out}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1}}
.step{font-size:.75rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#6366f1;text-align:center}
.q{font-size:1.45rem;font-weight:800;text-align:center;margin:6px 0 16px;line-height:1.25}
.hint{background:#f1f5f9;border-radius:12px;padding:10px 14px;font-size:.92rem;margin:14px 0 0}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.btn{border:0;border-radius:14px;padding:14px 22px;font-size:1.05rem;font-weight:800;color:#fff;cursor:pointer;transition:transform .1s}
.btn:hover{transform:scale(1.04)}
.yes{background:#10b981;min-width:130px}.no{background:#f43f5e;min-width:130px}.pri{background:#4f46e5}.dark{background:#334155}
.opt{background:#fff;border:3px solid #e2e8f0;border-radius:16px;padding:8px;cursor:pointer;width:calc(50% - 6px);font:inherit;text-align:center}
.opt:hover{border-color:#6366f1}
.opt b{display:block;font-size:.88rem;margin-top:2px}
.opt svg{width:100%;height:auto;background:#f8fafc;border-radius:10px}
.big{display:flex;flex-direction:column;gap:10px}
.big .opt{width:100%;text-align:left;padding:16px;display:flex;gap:14px;align-items:center;font-size:1.05rem;font-weight:700}
.big .opt span{font-size:2rem}
.crumbs{font-size:.8rem;color:#64748b;margin-bottom:10px;text-align:center}
.crumbs i{font-style:normal;background:#e0e7ff;color:#3730a3;border-radius:99px;padding:2px 9px;margin:2px;display:inline-block}
.back{background:none;border:0;color:#6366f1;font-weight:700;cursor:pointer;margin-top:14px}
.tree{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;align-items:center;margin:0 0 14px;font-size:.85rem;font-weight:700}
.tree span{padding:3px 11px;border-radius:99px;background:#e2e8f0}
.tree .last{color:#fff}
.res{text-align:center;border:4px solid;border-radius:18px;padding:18px;margin-bottom:14px}
.res .em{font-size:3.4rem}.res h2{margin:4px 0;font-size:1.8rem}.res .fam{font-weight:800;text-transform:uppercase;font-size:.78rem;letter-spacing:.07em;opacity:.8}
.info{display:grid;gap:8px;text-align:left;font-size:.95rem;margin-bottom:14px}
.info div{background:#f8fafc;border-radius:10px;padding:9px 13px}
.info b{color:#4f46e5}
input[type=text]{width:100%;padding:14px;font-size:1.2rem;border:3px solid #c7d2fe;border-radius:14px;margin:8px 0}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-bottom:10px}
.chip{border:0;background:#e0e7ff;color:#3730a3;font-weight:700;border-radius:99px;padding:6px 12px;cursor:pointer}
.atoms{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin:12px 0}
.at{text-align:center;font-size:.8rem;font-weight:700}
.at div{width:54px;height:54px;border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;font-size:1.3rem;font-weight:800;margin:0 auto 2px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.grid button{border:0;border-radius:12px;padding:12px 6px;color:#fff;font-weight:800;cursor:pointer;font-size:.95rem}
.fb{padding:12px;border-radius:12px;margin-top:12px;font-weight:600}
.ok{background:#d1fae5;color:#065f46}.bad{background:#ffe4e6;color:#9f1239}
.score{display:flex;justify-content:space-between;font-weight:800;color:#4f46e5;margin-bottom:6px}
table{width:100%;border-collapse:collapse;font-size:.85rem}
td,th{padding:7px;border-bottom:1px solid #e2e8f0;text-align:left;vertical-align:top}
@media(max-width:520px){.q{font-size:1.2rem}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
<h1>🔬 Classifying Matter Detective</h1>
<nav id="nav"></nav>
<div id="view"></div>
</div>
<script>
const $=s=>document.querySelector(s);
const T={
element:{n:'Element',e:'🪙',fam:'Pure Substance',sub:'',c:'#d97706',bg:'#fef3c7',d:'Only ONE kind of atom. Atoms can be alone (He, Fe) or joined to the same kind (O₂, N₂, O₃).',ex:'Helium, iron, oxygen gas, gold, diamond (carbon)',clue:'Formula has one capital letter. In a diagram, every particle is the same color.',mix:'O₂ is still an element! The atoms are bonded, but they are all the SAME atom.'},
compound:{n:'Compound',e:'💧',fam:'Pure Substance',sub:'',c:'#2563eb',bg:'#dbeafe',d:'Two or more DIFFERENT elements chemically bonded in a fixed ratio. Every particle is identical.',ex:'Water (H₂O), carbon dioxide (CO₂), salt (NaCl), sugar',clue:'Formula has 2+ capital letters. In a diagram, every molecule is identical and has 2+ colors.',mix:'Compounds have totally different properties than their elements: Na is a explosive metal and Cl₂ is a poison gas, but NaCl is table salt!'},
solution:{n:'Solution',e:'🌊',fam:'Mixture',sub:'Homogeneous',c:'#0891b2',bg:'#cffafe',d:'Looks the same everywhere. Particles are so tiny they never settle and do NOT scatter light.',ex:'Salt water, air, brass, vinegar',clue:'Looks the same throughout and the particles are single atoms or tiny molecules, so they never settle and you cannot see them. (In a liquid or gas, a light beam passes straight through.)',mix:'Salt water is NOT a compound: salt and water are not bonded, and you can make it saltier or weaker.'},
colloid:{n:'Colloid',e:'🥛',fam:'Mixture',sub:'Homogeneous',c:'#7c3aed',bg:'#ede9fe',d:'Looks uniform, but particles are big enough to scatter light (Tyndall Effect). They never settle.',ex:'Milk, fog, mayonnaise, whipped cream, gelatin',clue:'Looks the same throughout, but the mixed-in particles are tiny clumps, droplets or bubbles that never settle. (In a liquid or gas, a light beam shows up inside.)',mix:'Milk looks like a solution, but shine a flashlight through it and the beam shows up!'},
suspension:{n:'Suspension',e:'🫙',fam:'Mixture',sub:'Heterogeneous',c:'#b45309',bg:'#fde68a',d:'Bigger particles float for a while, then SETTLE out or get caught by a filter.',ex:'Muddy water, Italian dressing, orange juice with pulp',clue:'Shake it, wait, and it separates into layers.',mix:'Solutions never settle. If it separates when it sits, it is a suspension.'},
mechanical:{n:'Mechanical Mixture',e:'🥗',fam:'Mixture',sub:'Heterogeneous',c:'#16a34a',bg:'#dcfce7',d:'Different pieces you can see and pick apart. They do not float and settle; they just sit there.',ex:'Trail mix, granite, salad, pizza, sand + iron filings',clue:'You can point to the different parts with your finger.',mix:'Granite looks like one rock, but it is made of different mineral crystals, so it is a mixture.'}
};
T.compound.mix=T.compound.mix.replace('a explosive','an explosive');
// name, formula, type
const DB=[['Helium','He','element'],['Iron','Fe','element'],['Oxygen gas','O₂','element'],['Gold','Au','element'],['Nitrogen gas','N₂','element'],['Ozone','O₃','element'],['Diamond','C','element'],['Copper wire','Cu','element'],['Water','H₂O','compound'],['Carbon dioxide','CO₂','compound'],['Table salt','NaCl','compound'],['Sugar','C₁₂H₂₂O₁₁','compound'],['Baking soda','NaHCO₃','compound'],['Ammonia','NH₃','compound'],['Methane','CH₄','compound'],['Hydrogen peroxide','H₂O₂','compound'],['Salt water','','solution'],['Air','','solution','Air is a solution of gases (mostly nitrogen and oxygen) mixed evenly. The gases are not bonded to each other.'],['Brass','','solution','Alloys are SOLID solutions: metals melted together and mixed evenly, so the atoms of each metal are spread out uniformly. You can\'t see or pick out the parts.'],['Vinegar','','solution'],['Soda (no bubbles)','','solution'],['Milk','','colloid'],['Fog','','colloid'],['Mayonnaise','','colloid'],['Whipped cream','','colloid','Whipped cream is a foam: tiny air bubbles spread evenly through cream. Foams are colloids.'],['Gelatin dessert','','colloid','Gelatin is a colloid: water trapped inside a network of protein particles.'],['Muddy water','','suspension'],['Italian dressing','','suspension'],['Orange juice with pulp','','suspension'],['Trail mix','','mechanical'],['Granite','','mechanical'],['Salad','','mechanical'],['Pizza','','mechanical'],['Sand and iron filings','','mechanical'],['Silver','Ag','element'],['Aluminum foil','Al','element'],['Hydrogen gas','H₂','element'],['Chlorine gas','Cl₂','element'],['Neon','Ne','element'],['Argon','Ar','element'],['Sulfur','S','element'],['Liquid mercury','Hg','element'],['Zinc','Zn','element'],['Lead','Pb','element'],['Tin','Sn','element'],['Platinum','Pt','element'],['Sodium metal','Na','element'],['Calcium metal','Ca','element'],['Graphite','C','element'],['Lithium','Li','element'],['Nickel','Ni','element'],['Silicon','Si','element'],['Phosphorus','P','element'],['Iodine','I₂','element'],['Magnesium ribbon','Mg','element'],['Potassium','K','element'],['Titanium','Ti','element'],['Uranium','U','element'],['Fluorine gas','F₂','element'],['Ice','H₂O','compound'],['Distilled water','H₂O','compound'],['Dry ice','CO₂','compound'],['Rust','Fe₂O₃','compound'],['Chalk','CaCO₃','compound'],['Glucose','C₆H₁₂O₆','compound'],['Ethanol','C₂H₅OH','compound'],['Propane','C₃H₈','compound'],['Carbon monoxide','CO','compound'],['Lye','NaOH','compound'],['Sand (silicon dioxide)','SiO₂','compound'],['Laughing gas','N₂O','compound'],['Hydrated lime','Ca(OH)₂','compound'],['Magnesium oxide','MgO','compound'],['Hydrochloric acid gas','HCl','compound'],['Sulfuric acid','H₂SO₄','compound'],['Salt substitute','KCl','compound'],['Epsom salt (anhydrous)','MgSO₄','compound'],['Sea water','','solution'],['Sugar water','','solution'],['Black coffee','','solution'],['Clear soda','','solution'],['Steel','','solution','Alloys are SOLID solutions: metals melted together and mixed evenly, so the atoms of each metal are spread out uniformly. You can\'t see or pick out the parts.'],['Bronze','','solution','Alloys are SOLID solutions: metals melted together and mixed evenly, so the atoms of each metal are spread out uniformly. You can\'t see or pick out the parts.'],['Sterling silver','','solution','Alloys are SOLID solutions: metals melted together and mixed evenly, so the atoms of each metal are spread out uniformly. You can\'t see or pick out the parts.'],['14K gold','','solution','Alloys are SOLID solutions: metals melted together and mixed evenly, so the atoms of each metal are spread out uniformly. You can\'t see or pick out the parts.'],['Rubbing alcohol','','solution'],['Sweet tea','','solution'],['Butter','','colloid','Butter is a solid colloid: tiny water droplets spread evenly through fat. They never settle.'],['Cream','','colloid'],['Smoke','','colloid','Smoke is a colloid: tiny solid specks floating in a gas. They are small enough to never settle fast and they scatter light.'],['Shaving cream','','colloid','Shaving cream is a foam: tiny gas bubbles spread evenly through a liquid. Foams are colloids.'],['Hair gel','','colloid','Gels are colloids: a liquid spread through a tangled network of tiny solid particles.'],['Clouds','','colloid'],['Ice cream','','colloid','Ice cream is a colloid: tiny air bubbles and ice crystals spread evenly through cream.'],['Marshmallow','','colloid','Marshmallow is a solid foam: tiny gas bubbles trapped evenly in sugar. Gas bubbles in a liquid or solid make a colloid.'],['Foam','','colloid','Foams are colloids: tiny gas bubbles spread evenly through a liquid or solid.'],['Jelly','','colloid','Jelly is a colloid: water trapped inside a network of tiny particles (pectin).'],['Chalk in water','','suspension'],['Pond water','','suspension'],['Sand in water','','suspension'],['Flour in water','','suspension'],['Calamine lotion','','suspension'],['Snow globe','','suspension'],['Mud','','suspension'],['Cinnamon in water','','suspension'],['Fruit salad','','mechanical'],['Chex mix','','mechanical'],['Concrete','','mechanical'],['Soil','','mechanical'],['Chocolate chip cookie','','mechanical'],['Sand and gravel','','mechanical'],['Rice and beans','','mechanical'],['Salt and pepper','','mechanical'],['Bag of marbles','','mechanical'],['Cereal','','mechanical']];
const SYM=new Set("H He Li Be B C N O F Ne Na Mg Al Si P S Cl Ar K Ca Sc Ti V Cr Mn Fe Co Ni Cu Zn Ga Ge As Se Br Kr Rb Sr Y Zr Nb Mo Tc Ru Rh Pd Ag Cd In Sn Sb Te I Xe Cs Ba La Ce Nd Sm Gd Dy Er Yb Lu Hf Ta W Re Os Ir Pt Au Hg Tl Pb Bi Po At Rn Fr Ra Ac Th Pa U Np Pu".split(" "));
const R='#ef4444',B='#3b82f6';
function mol(a,b){return `<svg viewBox="0 0 130 90">${b.map(([i,j])=>`<line x1="${a[i][0]}" y1="${a[i][1]}" x2="${a[j][0]}" y2="${a[j][1]}" stroke="#475569" stroke-width="4"/>`).join('')}${a.map(([x,y,c])=>`<circle cx="${x}" cy="${y}" r="9" fill="${c}"/>`).join('')}</svg>`}
const D=[
mol([[20,20,R],[70,30,R],[110,18,R],[40,62,R],[90,66,R],[115,58,R]],[]),
mol([[18,22,R],[36,30,R],[80,15,R],[98,22,R],[50,65,R],[68,58,R],[105,62,R],[118,52,R]],[[0,1],[2,3],[4,5],[6,7]]),
mol([[25,22,B],[10,38,R],[42,38,R],[85,18,B],[70,34,R],[100,34,R],[60,66,B],[45,80,R],[77,80,R]],[[0,1],[0,2],[3,4],[3,5],[6,7],[6,8]]),
mol([[20,20,R],[38,28,R],[95,20,R],[112,28,R],[30,64,B],[15,78,R],[45,78,R],[95,64,B],[80,78,R],[110,78,R]],[[0,1],[2,3],[4,5],[4,6],[7,8],[7,9]])];
const tyn=`<svg viewBox="0 0 280 100" style="width:100%;max-width:340px;display:block;margin:0 auto 10px"><defs><linearGradient id="g"><stop offset="0" stop-color="#fde047" stop-opacity=".9"/><stop offset="1" stop-color="#fde047" stop-opacity=".7"/></linearGradient></defs>
<rect x="45" y="22" width="60" height="62" rx="8" fill="#bae6fd" stroke="#475569" stroke-width="2"/><rect x="175" y="22" width="60" height="62" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
<rect x="2" y="50" width="43" height="5" fill="url(#g)"/><rect x="105" y="50" width="70" height="5" fill="url(#g)"/><rect x="175" y="50" width="60" height="5" fill="url(#g)"/><rect x="235" y="50" width="30" height="5" fill="url(#g)" opacity=".5"/>
<rect x="45" y="50" width="60" height="5" fill="#fde047" opacity=".25"/>
<text x="75" y="97" text-anchor="middle" font-size="11" font-weight="700">Beam passes (no glow)</text><text x="205" y="97" text-anchor="middle" font-size="11" font-weight="700">Beam glows inside!</text></svg>`;
const N={
start:{t:'What are you looking at?',s:'Start here',big:[['🧬','A molecular-scale diagram (atoms / molecules)','diag'],['📸','A real sample or photograph (macro scale)','m1'],['🔤','A chemical formula or substance name','LAB']]},
diag:{t:'Which picture matches what you see?',s:'Diagram path',h:'Look at the colors. Same color = same kind of atom. Lines = chemical bonds.',cards:[['One kind of atom, all separate',D[0],'R:element'],['One kind of atom, joined together',D[1],'R:element'],['Identical molecules, each with 2+ colors',D[2],'R:compound'],['Two or more different kinds of particles mixed',D[3],'u']]},
u:{t:'Is the mixture uniform (the same throughout)?',s:'Mixture found!',h:'Take a sample from the top and the bottom. Are they exactly the same?',y:'ty',n:'het'},
m1:{t:'Can you see 2 or more different materials, chunks, layers or specks?',s:'Macro path · Step 1',h:'Look closely! Granite has crystals, salad has veggies, muddy water has dirt.',y:'het',n:'m2'},
m2:{t:'Is it made of MORE THAN ONE substance?',s:'Macro path · Step 2',h:'Check the ingredient list. Could you separate it by boiling, evaporating, or filtering? (Salt water: boil it and salt remains.)',y:'ty',n:'m3'},
m3:{t:'Can it be broken into simpler substances by a chemical change?',s:'Macro path · Step 3',h:'Water splits into hydrogen and oxygen with electricity (YES). Gold cannot be broken down any more (NO).',y:'R:compound',n:'R:element'},
ty:{t:'Does it scatter light? Can you see the beam of a laser or flashlight?',s:'Tyndall Effect test',h:'Liquids and gases: beam visible = Colloid, no beam inside = Solution. Solids (metals, butter, gel) can\'t be tested this way. Ask instead: are the mixed-in particles single atoms/tiny molecules (Solution) or tiny clumps, droplets or bubbles (Colloid)?',pre:tyn,y:'R:colloid',n:'R:solution'},
het:{t:'If it sits still, do tiny particles settle out or get caught by a filter?',s:'Heterogeneous mixture',h:'Suspension = tiny bits that float, then settle (shake before use!). Mechanical = chunks you could pick out with your hands.',y:'R:suspension',n:'R:mechanical'}};
let tab='id',node='start',hist=[],labIn='',rd=null;
function tree(k){const t=T[k],p=['Matter',t.fam];if(t.sub)p.push(t.sub);p.push(t.n);return `<div class="tree">${p.map((x,i)=>`<span ${i==p.length-1?`class="last" style="background:${t.c}"`:''}>${x}</span>`).join(' › ')}</div>`}
function resCard(k){const t=T[k];return `<div class="res" style="background:${t.bg};border-color:${t.c};color:${t.c}"><div class="em">${t.e}</div><div class="fam">${t.fam}${t.sub?' · '+t.sub:''}</div><h2>${t.n}</h2><div style="color:#1e293b;font-weight:600">${t.d}</div></div><div class="info"><div><b>Examples:</b> ${t.ex}</div><div><b>🔎 Clue:</b> ${t.clue}</div><div><b>⚠️ Common mix-up:</b> ${t.mix}</div></div>`}
function go(n,l){if(n=='LAB'){tab='lab';return draw()}hist.push([node,l]);node=n;draw()}
function back(){const h=hist.pop();node=h[0];draw()}
function reset(){node='start';hist=[];draw()}
function idView(){
if(node.startsWith('R:')){const k=node.slice(2);return `<div class="card">${hist.length?`<div class="crumbs">${hist.map(h=>`<i>${h[1]}</i>`).join('›')}</div>`:''}${tree(k)}${resCard(k)}<div class="row"><button class="btn pri" onclick="reset()">🔄 Start Over</button><button class="btn dark" onclick="tab='ch';draw()">🎯 Practice Quiz</button></div></div>`}
const n=N[node];let h=`<div class="card"><div class="step">${n.s}</div>`;
if(hist.length)h+=`<div class="crumbs">${hist.map(x=>`<i>${x[1]}</i>`).join('›')}</div>`;
h+=`<div class="q">${n.t}</div>${n.pre||''}`;
if(n.big)h+=`<div class="big">${n.big.map(b=>`<button class="opt" onclick="go('${b[2]}','${b[1].split(' (')[0].replace(/'/g,'')}')"><span>${b[0]}</span>${b[1]}</button>`).join('')}</div>`;
else if(n.cards)h+=`<div class="row">${n.cards.map(c=>`<button class="opt" onclick="go('${c[2]}','${c[0].split(',')[0]}')">${c[1]}<b>${c[0]}</b></button>`).join('')}</div>`;
else h+=`<div class="row"><button class="btn yes" onclick="go('${n.y}','Yes')">YES</button><button class="btn no" onclick="go('${n.n}','No')">NO</button></div>`;
if(n.h)h+=`<div class="hint">💡 ${n.h}</div>`;
if(hist.length)h+=`<div style="text-align:center"><button class="back" onclick="back()">← Back</button></div>`;
return h+'</div>'}
function parse(s){s=s.replace(/[₀-₉]/g,c=>c.charCodeAt(0)-8320).replace(/\s/g,'');if(!s||!/^([A-Z][a-z]?\d*|\(|\)\d*)+$/.test(s))return null;
let g=0;while(/\(([^()]*)\)(\d*)/.test(s)&&g++<9)s=s.replace(/\(([^()]*)\)(\d*)/,(m,a,n)=>a.repeat(+n||1));
const c={};let bad=false;s.replace(/([A-Z][a-z]?)(\d*)/g,(m,e,n)=>{if(!SYM.has(e))bad=true;c[e]=(c[e]||0)+(+n||1)});return bad||!Object.keys(c).length?null:c}
const hue=e=>[...e].reduce((a,c)=>a*31+c.charCodeAt(0),7)%360;
function bubbles(c){return `<div class="atoms">${Object.entries(c).map(([e,n])=>`<div class="at"><div style="background:hsl(${hue(e)},60%,45%)">${e}</div>×${n}</div>`).join('')}</div>`}
const sub=s=>s.replace(/\d/g,d=>'₀₁₂₃₄₅₆₇₈₉'[d]);
function labResult(q){q=q.trim();if(!q)return '';
if(q.includes('+')){const parts=q.split('+').map(x=>x.trim()).filter(Boolean);return `<div class="res" style="background:#dcfce7;border-color:#16a34a;color:#16a34a"><div class="em">🥣</div><h2>Mixture!</h2><div style="color:#1e293b;font-weight:600">${parts.join(' + ')}: different substances physically combined. A mixture can't be written as one formula. Use the <b>Identify</b> tab to find out which type.</div></div>`}
const low=q.toLowerCase(),f=DB.find(d=>d[0].toLowerCase()==low||(d[1]&&d[1]==sub(q.replace(/\s/g,''))));
if(!f&&low.length>2){const m=DB.filter(d=>d[0].toLowerCase().includes(low));if(m.length)return `<div class="hint">🔎 Did you mean: ${m.slice(0,8).map(d=>`<button class="chip" onclick="labIn='${d[0].replace(/'/g,'')}';draw()">${d[0]}</button>`).join(' ')}</div>`}
if(f){const c=f[1]?parse(f[1]):null;return `<div style="text-align:center;font-weight:800;margin-top:6px">${f[0]} ${f[1]?'('+f[1]+')':''}</div>${c?bubbles(c):''}${tree(f[2])}${f[3]?`<div class="hint" style="margin:0 0 12px">💡 ${f[3]}</div>`:''}${resCard(f[2])}`}
const c=parse(q);if(c){const k=Object.keys(c).length==1?'element':'compound';return `<div style="text-align:center;font-weight:800">${sub(q)} contains <b>${Object.keys(c).length}</b> kind${Object.keys(c).length>1?'s':''} of atom</div>${bubbles(c)}${tree(k)}${resCard(k)}`}
return `<div class="hint">🤔 I don't know that one. For formulas, check capitals (<b>Co</b> is cobalt, <b>CO</b> is carbon monoxide). Or use the <b>Identify</b> tab.</div>`}
function labView(){return `<div class="card"><div class="step">Formula Lab</div><div class="q">Type a formula or substance name</div><input type="text" id="li" placeholder="Try H2O, NaCl, O2, milk..." value="${labIn}" oninput="labIn=this.value;$('#lo').innerHTML=labResult(labIn)" autocomplete="off" list="dl"><datalist id="dl">${DB.map(d=>`<option value="${d[0]}">`).join('')}</datalist><div class="chips">${['H2O','NaCl','O2','Fe','Ca(OH)2','NaCl + H2O','milk','granite'].map(x=>`<button class="chip" onclick="labIn='${x}';draw()">${x}</button>`).join('')}</div><div id="lo">${labResult(labIn)}</div><div class="hint">💡 Count the capital letters: <b>1 kind</b> of atom = element. <b>2+ kinds</b> bonded = compound. A "+" between substances = mixture.</div></div>`}
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const NEED_CORRECT=15,NEED_PCT=90,NEED_STREAK=10;
let st=null;
function newSession(){st={deck:shuf(DB),cur:null,pick:null,res:[],streak:0,best:0,sent:false};nextQ(true)}
function nextQ(first){if(!first)st.pick=null;if(!st.deck.length)st.deck=shuf(DB);st.cur=st.deck.shift();if(!first)draw()}
function ans(k){const c=st.cur,ok=k==c[2];st.pick=k;st.res.push({item:c[0],formula:c[1]||'—',type:c[2],student:k,ok});
if(ok){st.streak++;st.best=Math.max(st.best,st.streak)}else{st.streak=0;st.deck.splice(Math.min(3,st.deck.length),0,c)}draw()}
function stats(){const n=st.res.filter(r=>r.ok).length,t=st.res.length,pct=t?Math.round(100*n/t):0;
return{n,t,pct,byScore:n>=NEED_CORRECT&&pct>=NEED_PCT,byStreak:st.best>=NEED_STREAK}}
const inFrame=()=>window.parent!==window;
function submitSimulation(simData=null){const message={action:"SIM_COMPLETE"};if(simData!==null&&simData!==undefined)message.simData=simData;
const parentOrigin="https://custom.scienceclass.rocks";window.parent.postMessage(message,parentOrigin)}
function sendResults(){const x=stats();if(st.sent||!(x.byScore||x.byStreak))return;
const byType=Object.keys(T).map(k=>{const r=st.res.filter(q=>q.type==k),c=r.filter(q=>q.ok).length;return{type:T[k].n,correct:c,attempted:r.length,percent:r.length?Math.round(100*c/r.length):null}});
const mc={};st.res.filter(r=>!r.ok).forEach(r=>{const key=r.item+' ('+T[r.type].n+')';mc[key]=(mc[key]||0)+1});
const missed=Object.entries(mc).sort((a,b)=>b[1]-a[1]).slice(0,25).map(([k,v])=>v>1?k+' x'+v:k).join('; ');
try{submitSimulation({summary:`${x.n}/${x.t} correct (${x.pct}%), best streak ${st.best}. Unlocked by ${x.byScore?`score (${NEED_CORRECT}+ correct at ${NEED_PCT}%+)`:`a ${NEED_STREAK}-in-a-row streak`}.`,score:x.n,total:x.t,percent:x.pct,bestStreak:st.best,unlockedBy:x.byScore?'score':'streak',missedItems:missed||'none',dataTable:byType});st.sent=true}catch(e){console.error(e)}draw()}
function meter(label,v,max,ok){const w=Math.min(100,Math.round(100*v/max));return `<div style="margin:6px 0"><div style="display:flex;justify-content:space-between;font-size:.82rem;font-weight:700"><span>${ok?'✅':'⬜'} ${label}</span></div><div style="background:#e2e8f0;border-radius:99px;height:8px"><div style="width:${w}%;height:8px;border-radius:99px;background:${ok?'#10b981':'#6366f1'}"></div></div></div>`}
function chView(){if(!st)newSession();const x=stats(),c=st.cur,keys=Object.keys(T),done=st.pick!==null,open=x.byScore||x.byStreak;
let h=`<div class="card"><div class="score"><span>Answered: ${x.t}</span><span>✅ ${x.n} (${x.t?x.pct:0}%)</span><span>🔥 ${st.streak}</span></div><div class="step">What type of matter is this?</div><div class="q">${c[0]}${c[1]?`<br><span style="color:#4f46e5">${c[1]}</span>`:''}</div>`;
h+=`<div class="grid">${keys.map(k=>`<button style="background:${T[k].c}" ${done?'disabled':''} onclick="ans('${k}')">${T[k].e} ${T[k].n}</button>`).join('')}</div>`;
if(done){const ok=st.pick==c[2];h+=`<div class="fb ${ok?'ok':'bad'}">${ok?'🎉 Correct!':'Not quite. It is a '+T[c[2]].n+'.'} ${c[3]||T[c[2]].clue}${ok?'':' (You\'ll see this one again soon.)'}</div><div class="row" style="margin-top:12px"><button class="btn pri" onclick="nextQ()">Next →</button></div>`}
h+=`<div class="hint" style="margin-top:16px"><b>📤 Ready to submit? Reach EITHER goal:</b>
${meter(`${NEED_CORRECT}+ correct AND ${NEED_PCT}%+ accuracy (${x.n} correct, ${x.pct}%)`,Math.min(x.n/NEED_CORRECT,x.pct/NEED_PCT)*100,100,x.byScore)}
<div style="text-align:center;font-size:.8rem;font-weight:800;color:#64748b">— or —</div>
${meter(`${NEED_STREAK} in a row (best: ${st.best})`,st.best,NEED_STREAK,x.byStreak)}
<div class="row" style="margin-top:10px">${st.sent?'<div class="fb ok" style="margin:0">✅ Submitted! Your teacher can see your results. Keep practicing if you like.</div>':open?`<button class="btn yes" onclick="sendResults()">📤 Submit My Results</button>`:'<button class="btn" style="background:#cbd5e1;cursor:not-allowed" disabled>🔒 Keep going to unlock Submit</button>'}
<button class="btn dark" onclick="if(confirm('Start over and reset your score?')){st=null;draw()}">🔁 Reset</button></div>
${!st.sent&&open&&!inFrame()?'<div style="margin-top:8px;font-size:.85rem">ℹ️ Preview mode: this page is not inside IterātED, so Submit will not reach your teacher.</div>':''}</div></div>`;
return h}
function refView(){const r=Object.entries(T);return `<div class="card"><div class="step">Cheat Sheet</div><div class="tree" style="margin-top:8px"><span>Matter</span> › <span>Pure Substance (element, compound)</span> | <span>Mixture (solution, colloid, suspension, mechanical)</span></div><div class="info"><div><b>Pure substances:</b> fixed composition, cannot be separated physically.</div><div><b>Mixtures:</b> variable composition, can be separated physically, not chemically bonded.</div></div><table><tr><th>Type</th><th>Quick test</th><th>Examples</th></tr>${r.map(([k,t])=>`<tr><td style="color:${t.c};font-weight:800">${t.e} ${t.n}</td><td>${t.clue}</td><td>${t.ex}</td></tr>`).join('')}</table></div>`}
const TABS=[['id','🔍 Identify'],['lab','🔤 Formula Lab'],['ch','🎯 Practice'],['ref','📋 Cheat Sheet']];
function draw(){$('#nav').innerHTML=TABS.map(t=>`<button class="${tab==t[0]?'on':''}" onclick="tab='${t[0]}';draw()">${t[1]}</button>`).join('');
$('#view').innerHTML={id:idView,lab:labView,ch:chView,ref:refView}[tab]()}
draw();
</script>
</body>
</html>
